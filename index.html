<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KingJayan/pfp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background: #0d1117; 
    font-family: 'JetBrains Mono', monospace;
  }
  
  .profile-badge {
    position: relative;
    width: 400px;
    height: 400px;
    border-radius: 50%; 
    background: #0d1117; 
    box-shadow: 
      inset 0 0 0 1px rgba(255, 255, 255, 0.1),
      0 20px 40px -10px rgba(0, 0, 0, 0.8);
      
    display: flex;
    flex-direction: column;
    justify-content: flex-end; 
    align-items: center;
    
    box-sizing: border-box;
    padding-bottom: 85px; 
    overflow: hidden;
  }

  .cli {
    display: flex;
    align-items: center;
    margin-bottom: 18px; 
    z-index: 2;
  }

  .prompt-char {
    color: #3b82f6; 
    font-size: 24px;
    opacity: 0.8;
    margin-right: 15px;
    transform: translateY(1px);
  }

  .name-text {
    font-size: 30px; 
    font-weight: 500;
    color: #e6edf3; 
    letter-spacing: -0.5px;
    text-transform: lowercase; 
    line-height: 1;
  }

  .cursor {

    width: 0.72em; 
    height: 1.65rem;
    background-color: #e6edf3;
    opacity: 0.65;
    margin-left: 2.3px;
    padding-bottom: 4px;
  }

  .status-row {
    display: flex;
    gap: 8px;
    opacity: 0.8;
  }

  .micro-dot {
    width: 8px;       
    height: 8px;      
    border-radius: 25%;
  }

  .r { background-color: #ef4444; }
  .g { background-color: #22c55e; }
  .b { background-color: #3b82f6; }

  .profile-badge::after {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
    opacity: 0.3; 
    pointer-events: none;
    border-radius: 50%;
  }

</style>
</head>
<body>

<div class="profile-badge">
  
  <div class="cli">
    <span class="prompt-char">&gt;</span>
    <span class="name-text">jayan_patel</span>
    <div class="cursor"></div>
  </div>
  
  <div class="status-row">
    <div class="micro-dot r"></div>
    <div class="micro-dot g"></div>
    <div class="micro-dot b"></div>
  </div>

</div>

</body>
</html>
